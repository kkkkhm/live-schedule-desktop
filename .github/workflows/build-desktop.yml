name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run pack:win
            artifact: windows-portable
          - os: macos-latest
            command: npm run pack:mac
            artifact: macos-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Summarize macOS packaging failure
        if: failure() && runner.os == 'macOS'
        run: |
          echo "## macOS packaging diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "The Intel and Apple Silicon apps are packaged separately and zipped with macOS ditto." >> "$GITHUB_STEP_SUMMARY"
          find desktop-dist -maxdepth 2 \( -type f -o -type d \) | sort | tail -100 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "$GITHUB_REF_NAME"

